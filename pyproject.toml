[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag-assistant"
version = "0.1.0"
description = "LangGraph-powered RAG agent: hybrid retrieval over ChromaDB, groundedness verification, and a FastAPI REST interface"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sergio Oriola" }]
dependencies = [
    "langchain>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langchain-openai>=0.3",
    "langchain-chroma>=0.2",
    "langchain-text-splitters>=0.3",
    "langgraph-checkpoint-sqlite>=2.0",
    "chromadb>=1.0",
    "rank-bm25>=0.2",
    "pypdf>=5.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx2>=2.5",  # used by fastapi.testclient (starlette deprecated httpx there)
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint.isort]
# "fakes" is the tests' local helper module; without this, isort would file it
# under third-party imports.
known-first-party = ["agentic_rag", "fakes"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modern Python syntax)
    "B",   # flake8-bugbear (common subtle bugs)
]
